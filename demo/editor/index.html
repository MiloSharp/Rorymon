<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rorydex Editor</title>
  <link rel="stylesheet" href="styles.css?v=20261005j">
</head>
<body>
  <main class="editor-shell">
    <header>
      <div><small>CREATOR TOOLS</small><h1>Rorydex Editor</h1><p>Create Rorymon and tune their moves. Changes are used in new encounters and battles.</p></div>
      <a href="../overworld/index.html">← Return to overworld</a>
    </header>
    <nav class="tabs" aria-label="Editor sections">
      <button class="active" data-tab="species">Rorymon</button>
      <button data-tab="moves">Moves</button>
    </nav>
    <section class="workspace">
      <aside>
        <button id="new-entry" class="new-entry">＋ New Rorymon</button>
        <div id="entry-list" class="entry-list"></div>
      </aside>
      <form id="editor-form">
        <div class="form-heading"><div><small id="form-kicker">RORYMON</small><h2 id="form-title">Choose a Rorymon</h2></div><span id="save-state" role="status"></span></div>
        <div id="form-fields" class="form-fields"></div>
        <div class="form-actions">
          <button id="reset-entry" type="button">Reset to default</button>
          <button id="delete-entry" type="button">Delete</button>
          <button type="submit">Save changes</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="app.js?v=20261005j"></script>
</body>
</html>
